# 鸣鹤 (MingHe) 服务器配置

[server]
# 监听地址
listen_addr = "0.0.0.0"
# SIP TLS 端口 (SIPS)
sip_port = 5061
# 服务器域名或 IP 地址
# 用于 SIP URI 和 TLS 证书生成
# 可以是域名（如 "minghe.local"）或 IP 地址（如 "192.168.1.100"）
host = "minghe.local"

[extensions]
# 分机号码范围
range_start = 1000
range_end = 2000
# 所有分机的默认密码（未在 [passwords] 中单独配置的分机使用此密码）
# 必须替换占位值，至少 12 字节；知道共享密码的人可以登录所有使用它的分机。
default_password = "CHANGE_ME_TO_A_STRONG_PASSWORD"

[tls]
# 证书路径（留空则自动生成自签名证书）
# 支持域名证书和 IP 证书
cert_path = ""
key_path = ""

# 端到端模式由客户端使用 ICE / DTLS-SRTP 建立媒体；Bria 兼容模式分配 UDP 中继端口。
# 两种模式均要求 SHA-256 Digest；MESSAGE 均要求 JWE。
# 没有 [media] 时要求签名 SDP / DTLS-SRTP，详见 E2EE.md。
# Bria 跨网络通话可在文件末尾启用以下兼容配置，详见 BRIA.md：
# [media]
# rtp_port_start = 20000
# rtp_port_end = 20020
# media_addr = "203.0.113.10"  # 替换为双方可达的服务器公网 IPv4
# 兼容模式由服务器解密重加密语音，不是端到端加密。

# 单独为分机设置密码（覆盖 default_password）
# 格式：分机号 = "密码"
# 未列出的分机使用 default_password
[passwords]
# 1001 = "CHANGE_ME_EXTENSION_1001"
# 1002 = "CHANGE_ME_EXTENSION_1002"
# 1003 = "CHANGE_ME_EXTENSION_1003"
