# 鸣鹤 (MingHe) 服务器配置

[server]
# 监听地址
listen_addr = "0.0.0.0"
# SIP TLS 端口 (SIPS)
sip_port = 5061
# 服务器域名或 IP 地址
# 用于 SIP URI 和 TLS 证书生成
# 可以是域名（如 "minghe.local"）或 IP 地址（如 "192.168.1.100"）
host = "minghe.local"

[extensions]
# 分机号码范围
range_start = 1000
range_end = 2000
# 所有分机的默认密码（未在 [passwords] 中单独配置的分机使用此密码）
# 必须替换占位值，至少 12 字节；知道共享密码的人可以登录所有使用它的分机。
default_password = "CHANGE_ME_TO_A_STRONG_PASSWORD"

[tls]
# 证书路径（留空则自动生成自签名证书）
# 支持域名证书和 IP 证书
cert_path = ""
key_path = ""

# 媒体由客户端使用 ICE / DTLS-SRTP 建立，服务器不分配 UDP 端口。
# 客户端必须支持 SHA-256 Digest、签名 SDP 和 JWE 消息；详见 E2EE.md。
# 旧 [media] 配置已停用，不应继续配置媒体地址或 SDES 密钥。

# 单独为分机设置密码（覆盖 default_password）
# 格式：分机号 = "密码"
# 未列出的分机使用 default_password
[passwords]
# 1001 = "CHANGE_ME_EXTENSION_1001"
# 1002 = "CHANGE_ME_EXTENSION_1002"
# 1003 = "CHANGE_ME_EXTENSION_1003"
