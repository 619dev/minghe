# ============================================================
# 鸣鹤 (MingHe) SIP Server — 配置模板
# ============================================================
#
# 使用前请复制此文件到 config/ 目录:
#   cp config.template.toml config/config.toml
#
# 然后根据实际环境修改配置值。
# 带 [必填] 标记的项必须根据实际情况修改。
# ============================================================

[server]
# SIP Digest 默认 sha256；仅为不支持 SHA-256 的客户端显式启用 md5。
# MD5 较弱，仍强制 TLS、qop=auth 和 nonce 重放检查；不改变媒体加密。
digest_algorithm = "sha256"
# Bria Mobile 兼容时改为 digest_algorithm = "md5"
# 监听地址（容器内建议保持 0.0.0.0）
listen_addr = "0.0.0.0"

# SIP TLS 端口 (SIPS 标准端口)
sip_port = 5061

# [必填] 服务器域名或 IP 地址
# 用于 SIP URI、TLS 证书生成和 Digest 认证的 realm
# 示例:
#   域名模式: host = "sip.example.com"
#   IP 模式:  host = "192.168.1.100"
host = "minghe.local"

[extensions]
# 分机号码范围（含起止），最多 10000 个号码
range_start = 1000
range_end = 2000

# [必填] 所有分机的默认密码
# 未在 [passwords] 中单独配置的分机使用此密码
# 必须替换占位值，至少 12 字节；建议每个分机使用不同的随机密码。
default_password = "CHANGE_ME_TO_A_STRONG_PASSWORD"

[tls]
# TLS 证书路径（cert_path 和 key_path 必须同时设置或同时留空）
# 客户端必须验证证书；自签名证书需导入信任，续期后更新信任。
# 留空 = 自动生成自签名证书（推荐内网使用）
# 指定路径 = 使用外部证书（推荐生产环境）
#
# 自签名证书模式:
#   cert_path = ""
#   key_path = ""
#   证书将自动生成到 certs/ 目录，并在到期前 30 天自动续期
#
# 外部证书模式:
#   cert_path = "/app/certs/fullchain.pem"
#   key_path = "/app/certs/privkey.pem"
#   请自行管理证书更新（如使用 certbot）
cert_path = ""
key_path = ""

# 可选媒体中继；部署与 Bria 接入见 DEPLOYMENT.md。
# mode = "sdes"（默认）：服务器解密重加密 SRTP，不是端到端加密。
# mode = "zrtp"：原样转发；双方强制 ZRTP、禁用 ICE 并核对 SAS，见 ZRTP.md。
# 不设置整个 [media] 表：签名 SDP / DTLS-SRTP，需适配 E2EE.md 协议。
# media_addr 填双方可访问的服务器公网 IPv4，不能填 Docker IP。
# 端口范围与 Docker/防火墙一致；ZRTP 起止值均为偶数，包含奇数 RTCP 端口。
# [media]
# mode = "sdes"
# rtp_port_start = 20000
# rtp_port_end = 20020
# media_addr = "203.0.113.10"

# ============================================================
# 分机独立密码（可选）
# ============================================================
# 为特定分机设置独立密码，覆盖 default_password
# 格式: 分机号 = "密码"
# 未列出的分机使用上方 default_password
#
# 示例:
[passwords]
# 1001 = "CHANGE_ME_EXTENSION_1001"
# 1002 = "CHANGE_ME_EXTENSION_1002"
# 1003 = "CHANGE_ME_EXTENSION_1003"
